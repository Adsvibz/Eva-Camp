name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for high and critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Build Windows installer and portable app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exercise the real Electron reception workflow
        run: npm run test:e2e
      - name: Upload UI and print verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-UI-and-print-checks
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-Windows-development-build
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
