name: Build Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-Windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -Path dist -Filter *.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'No Windows executable found' }
          gh release create "$env:GITHUB_REF_NAME" @files --draft --title "Eva Camp $env:GITHUB_REF_NAME" --generate-notes
