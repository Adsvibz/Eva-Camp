name: Build Windows release
on:
  push:
    tags: ['v*']
    branches: ['release/v0.1.0']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for high and critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exercise the real Electron reception workflow
        run: npm run test:e2e
      - name: Exercise application lock
        run: node tests/lock.e2e.cjs
      - name: Exercise Windows backup and restore
        run: node tests/backup.e2e.cjs
      - name: Upload UI and print verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-UI-and-print-checks
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-Windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish first preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -Path dist -Filter *.exe | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw 'Expected installer and portable Windows executables' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match package version' }
          $notes = @'
          ## First Windows preview
          Eva Camp is an offline reception application for Windows x64.

          ### Downloads
          - **Eva Camp Setup 0.1.0.exe**: Windows installer.
          - **Eva Camp 0.1.0.exe**: portable executable.
          - **SHA256SUMS.txt**: SHA-256 checksums for both executables.

          ### Included
          - Arabic/English interface, light/dark appearance and refreshed reception workspace.
          - Guests, companions, identity lookup and stay history.
          - Units, housekeeping, reservations, arrivals, departures and room transfers.
          - Payments, refunds, accommodation discounts, extras and booking statements.
          - Registration forms, drawn signatures and archived declarations.
          - Reports, daily closing, application PIN, local and password-protected portable backup/restore.

          ### Verification
          This release is published only after dependency audit, TypeScript checks, unit tests, Windows packaging, Electron reception checks, application-lock tests and same-account backup/restore tests pass.

          ### Preview limitations
          This is a pre-release for evaluation with synthetic data, not an approved production deployment. Clean Windows 10/11 installation, physical printing and cross-account/cross-PC restore still require manual acceptance testing. Windows executables are not code-signed. See README.md and docs/user-manual-ar.md for details.

          ### العربية
          أول إصدار تجريبي لويندوز 64 بت. حمّل ملف Setup للتثبيت أو الملف الآخر للتشغيل المحمول. استخدم بيانات تجريبية لحين إتمام اختبار التثبيت والطباعة والاستعادة على جهاز آخر.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          $files | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_))"
          } | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          gh release create $tag @files dist/SHA256SUMS.txt --target "$env:GITHUB_SHA" --prerelease --title "Eva Camp $tag - First Windows Preview" --notes-file release-notes.md
