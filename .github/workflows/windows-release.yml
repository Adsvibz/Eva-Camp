name: Build Windows release
on:
  push:
    tags: ['v*']
    branches: ['release/v0.1.0']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for high and critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exercise the real Electron reception workflow
        run: npm run test:e2e
      - name: Exercise application lock
        run: node tests/lock.e2e.cjs
      - name: Exercise Windows backup and restore
        run: node tests/backup.e2e.cjs
      - name: Upload UI and print verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-UI-and-print-checks
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-Windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish first preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match package version' }
          $installer = "dist/Eva Camp Setup $version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Windows installer not found' }
          Copy-Item -LiteralPath $installer -Destination dist/evacamp.exe
          $notes = @'
          ## Eva Camp — first Windows preview
          Download **evacamp.exe** below. This is the Windows x64 installer; no separate application files are required.

          ### Included
          Offline guests, units, bookings, payments/refunds, room transfers, extras/discounts, registration forms, reports, application PIN and backups. Arabic/English interface with saved appearance preferences.

          ### Verification
          Dependency audit, TypeScript checks, unit tests, Windows packaging, Electron reception checks, application-lock tests and same-account backup/restore tests must pass before publication.

          ### Preview limitations
          For evaluation with synthetic data. Clean Windows 10/11 installation, physical printing and cross-account/cross-PC restore still require manual acceptance testing. The installer is not code-signed.

          ### العربية
          حمّل evacamp.exe فقط: ملف تثبيت إيفا كامب لويندوز 64 بت، ولا يحتاج ملفات إضافية بجانبه. هذه أول نسخة تجريبية؛ استخدم بيانات وهمية لحين إتمام اختبار التثبيت والطباعة والاستعادة على جهاز آخر.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8
          gh release view $tag --json id *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --draft --prerelease --title "Eva Camp $tag - Windows Installer" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $tag dist/evacamp.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed' }
          $assets = (gh release view $tag --json assets | ConvertFrom-Json).assets
          foreach ($asset in $assets) {
            if ($asset.name -in @("Eva.Camp.Setup.$version.exe", "Eva.Camp.$version.exe", "Eva Camp Setup $version.exe", "Eva Camp $version.exe", "SHA256SUMS.txt")) {
              gh release delete-asset $tag $asset.name --yes
              if ($LASTEXITCODE -ne 0) { throw 'Could not remove superseded release asset' }
            }
          }
          gh release edit $tag --draft=false --prerelease --title "Eva Camp $tag - Windows Installer" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
          $assets = @((gh release view $tag --json assets | ConvertFrom-Json).assets)
          if ($assets.Count -ne 1 -or $assets[0].name -ne 'evacamp.exe') { throw 'Expected evacamp.exe as the only release asset' }
