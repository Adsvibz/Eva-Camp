name: Build Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci
      - name: Check for high and critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exercise the real Electron reception workflow
        run: npm run test:e2e
      - name: Exercise in-app update workflow
        run: node tests/updates.e2e.cjs
      - name: Exercise application lock
        run: node tests/lock.e2e.cjs
      - name: Exercise Windows backup and restore
        run: node tests/backup.e2e.cjs
      - name: Upload UI and print verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-UI-and-print-checks
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-Camp-Windows
          path: dist/evacamp.exe
          if-no-files-found: error
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path -LiteralPath 'dist/evacamp.exe')) { throw 'Installer was not built' }
          gh release create "$env:GITHUB_REF_NAME" 'dist/evacamp.exe' --draft --title "Eva Camp $env:GITHUB_REF_NAME" --generate-notes
